apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_VERSION: "0.8.1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
spec:
  replicas: 4
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: ghcr.io/tedi077/devops-lab-02:v0.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notes
spec:
  type: ClusterIP
  selector:
    app: notes
  ports:
    - port: 8000
      targetPort: 8000
