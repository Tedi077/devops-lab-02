name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://notes:ci-only@localhost:5432/notes

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t notes-api:${{ github.sha }} .

      - name: Smoke test
        run: |
          docker run -d --name notes-smoke -p 8000:8000 notes-api:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs notes-smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f notes-smoke || true
